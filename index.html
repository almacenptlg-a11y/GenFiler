<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GenFiler v1.0: Logistics Suite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- VARIABLES DE COLOR (THEMING ENGINE) --- */
        :root {
            /* MODO DÍA (Basado en v19 - Estilo Original) */
            --bg-body: #f0f2f5;
            --bg-card: #ffffff;
            --header-bg: #2c3e50;
            --header-text: #ffffff;
            --text-main: #2c3e50;
            --text-sec: #7f8c8d;
            --border-color: #ecf0f1;
            --input-bg: #ffffff;
            --input-border: #ced4da;
            --table-head-bg: #f8f9fa;
            --table-hover: #f1f2f6;
            --highlight: #2980b9; /* Azul v19 */
            --brand-color: #C50D23; /* Rojo Genovesa */
            --kpi-bg: #ffffff;
            --kpi-shadow: rgba(0,0,0,0.08);
            --scroll-track: #f1f1f1;
            --scroll-thumb: #888;
        }

        body.dark-mode {
            /* MODO NOCHE (Profesional Dark UI) */
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --header-bg: #000000;
            --header-text: #e0e0e0;
            --text-main: #e0e0e0;
            --text-sec: #a0a0a0;
            --border-color: #333333;
            --input-bg: #2c2c2c;
            --input-border: #444444;
            --table-head-bg: #252525;
            --table-hover: #2a2a2a;
            --highlight: #48dbfb; /* Cian Neón para contraste */
            --brand-color: #ff4757; /* Rojo brillante para noche */
            --kpi-bg: #252525;
            --kpi-shadow: rgba(0,0,0,0.5);
            --scroll-track: #2c2c2c;
            --scroll-thumb: #555;
        }

        /* --- ESTILOS BASE --- */
        body { background: var(--bg-body); padding: 25px; font-family: 'Segoe UI', system-ui, sans-serif; transition: all 0.3s ease; color: var(--text-main); }
        .main-card { background: var(--bg-card); border-radius: 16px; padding: 0; max-width: 1200px; margin: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.15); overflow: hidden; }
        
        /* HEADER */
        .header-panel { background: var(--header-bg); color: var(--header-text); padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--brand-color); }
        .header-logo { height: 45px; width: auto; filter: drop-shadow(0 0 2px rgba(255,255,255,0.5)); } /* Sutil brillo para el logo en fondo oscuro */

        .body-panel { padding: 30px; }

        /* KPI CARDS (v22 style updated) */
        .kpi-container { display: flex; gap: 20px; margin-bottom: 25px; flex-wrap: wrap; }
        .kpi-card { 
            flex: 1; min-width: 200px; background: var(--kpi-bg); padding: 20px; border-radius: 12px; 
            box-shadow: 0 4px 15px var(--kpi-shadow); border-left: 5px solid var(--highlight);
            display: flex; align-items: center; justify-content: space-between; transition: transform 0.2s;
        }
        .kpi-card:hover { transform: translateY(-3px); }
        .kpi-value { font-size: 1.8rem; font-weight: 800; color: var(--text-main); line-height: 1; }
        .kpi-label { font-size: 0.8rem; color: var(--text-sec); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .kpi-icon { font-size: 2rem; opacity: 0.15; color: var(--text-main); }

        /* LOG BOX */
        .log-box { background: #111; color: #00ff9d; padding: 15px; height: 120px; overflow-y: auto; font-family: 'Consolas', monospace; font-size: 11px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
        /* Scrollbar custom */
        .log-box::-webkit-scrollbar { width: 8px; }
        .log-box::-webkit-scrollbar-track { background: #111; }
        .log-box::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

        /* TABLA (v19 Style preserved but variable-ized) */
        .table-custom { width: 100%; border-collapse: separate; border-spacing: 0; }
        .table-custom thead th { 
            background-color: var(--table-head-bg); color: var(--text-sec); 
            font-weight: 700; text-transform: uppercase; font-size: 0.75rem; 
            padding: 15px; text-align: left; border-bottom: 2px solid var(--border-color);
            cursor: pointer; user-select: none; transition: 0.2s; position: sticky; top: 0;
        }
        .table-custom thead th:hover { background-color: var(--table-hover); color: var(--highlight); }
        .table-custom td { vertical-align: middle; padding: 12px 15px; border-bottom: 1px solid var(--border-color); color: var(--text-main); }
        .table-custom tr:hover { background-color: var(--table-hover); }

        /* TYPOGRAPHY TABLE */
        .txt-file { font-weight: 700; color: var(--text-main); }
        .txt-despacho { font-family: monospace; font-weight: bold; font-size: 1.1em; color: var(--brand-color); } /* Rojo Genovesa */
        .txt-repartidor { font-weight: 600; color: var(--highlight); }
        .badge-count { background: var(--border-color); color: var(--text-main); padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 0.8rem; }

        /* INPUTS & SEARCH */
        .search-box { position: relative; margin-bottom: 0; width: 100%; }
        .search-box input { 
            background: var(--input-bg); border: 1px solid var(--input-border); 
            color: var(--text-main); padding: 12px 15px 12px 45px; border-radius: 50px; width: 100%; 
            transition: 0.3s;
        }
        .search-box input:focus { outline: none; border-color: var(--highlight); box-shadow: 0 0 0 3px rgba(41, 128, 185, 0.1); }
        .search-box i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-sec); }

        /* FILE INPUT STYLING */
        .input-group-text { background-color: var(--input-bg); border-color: var(--input-border); color: var(--text-sec); }
        .form-control { background-color: var(--input-bg); border-color: var(--input-border); color: var(--text-main); }
        .form-control:focus { background-color: var(--input-bg); color: var(--text-main); border-color: var(--highlight); box-shadow: none; }

        /* BOTONES */
        .btn-theme { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); color: white; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        .btn-theme:hover { background: rgba(255,255,255,0.25); transform: rotate(15deg); }
        
        .btn-print { background: var(--text-main); color: var(--bg-card); border: none; font-size: 0.85rem; padding: 6px 15px; border-radius: 6px; transition: 0.2s; font-weight: 600; }
        .btn-print:hover { background: var(--brand-color); color: white; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }

        .btn-primary-custom { background-color: var(--highlight); color: white; border: none; }
        .btn-primary-custom:hover { background-color: var(--brand-color); color: white; }

        .sort-icon { float: right; color: var(--text-sec); font-size: 0.8em; margin-top: 4px; opacity: 0.5; }
        .th-active .sort-icon { color: var(--highlight); opacity: 1; }
    </style>
</head>
<body>

<div class="container">
    <div class="main-card">
        <div class="header-panel">
            <div class="d-flex align-items-center gap-3">
                <div id="headerLogoContainer"></div> 
                <div class="border-start border-secondary ps-3">
                    <h3 class="fw-bold m-0" style="letter-spacing: -0.5px;">GenFiler</h3>
                    <small style="opacity: 0.7; font-size: 0.75rem; letter-spacing: 1px;">LOGISTICS SUITE v1.0</small>
                </div>
            </div>
            
            <div class="d-flex align-items-center gap-3">
                <span class="badge bg-secondary px-3 py-2" id="statusBadge">Esperando Archivos</span>
                <button class="btn-theme" onclick="toggleTheme()" id="themeBtn" title="Cambiar Modo">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>
        
        <div class="body-panel">
            <div class="row g-3 align-items-center mb-4">
                <div class="col-md-9">
                    <div class="input-group input-group-lg shadow-sm">
                        <span class="input-group-text border-end-0"><i class="far fa-file-pdf" style="color: var(--brand-color)"></i></span>
                        <input type="file" id="pdfInput" class="form-control border-start-0" multiple accept=".pdf">
                    </div>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-primary-custom w-100 btn-lg fw-bold shadow-sm" onclick="procesarArchivos()">
                        <i class="fas fa-sync-alt me-2"></i> PROCESAR
                    </button>
                </div>
            </div>

            <div id="log" class="log-box">Sistema GenFiler listo. Seleccione sus reportes PDF.</div>

            <div id="resultPanel" style="display:none;">
                
                <div class="kpi-container">
                    <div class="kpi-card">
                        <div>
                            <div class="kpi-label">Archivos</div>
                            <div class="kpi-value" id="kpiFiles">0</div>
                        </div>
                        <i class="fas fa-file-contract kpi-icon"></i>
                    </div>
                    <div class="kpi-card">
                        <div>
                            <div class="kpi-label">Despachos Únicos</div>
                            <div class="kpi-value" id="kpiDespachos">0</div>
                        </div>
                        <i class="fas fa-truck-loading kpi-icon"></i>
                    </div>
                    <div class="kpi-card">
                        <div>
                            <div class="kpi-label">Total Productos</div>
                            <div class="kpi-value" id="kpiItems">0</div>
                        </div>
                        <i class="fas fa-boxes kpi-icon"></i>
                    </div>
                </div>

                <div class="row align-items-center mb-3 g-3">
                    <div class="col-md-7">
                        <div class="search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" id="searchInput" placeholder="Buscar Repartidor, Cliente, N° Despacho..." onkeyup="filtrarTabla()">
                        </div>
                    </div>
                    <div class="col-md-5 text-end">
                        <button class="btn btn-success fw-bold shadow-sm" onclick="descargarExcelGlobal()">
                            <i class="fas fa-file-excel me-2"></i>Exportar Todo
                        </button>
                    </div>
                </div>

                <div class="table-responsive" style="max-height: 500px; overflow-y: auto;">
                    <table class="table-custom" id="mainTable">
                        <thead>
                            <tr>
                                <th onclick="ordenar(0)" width="5%"> <i class="fas fa-sort sort-icon"></i></th>
                                <th onclick="ordenar(1)" width="25%">Archivo Original <i class="fas fa-sort sort-icon"></i></th>
                                <th onclick="ordenar(2)" width="15%" class="text-center">Despacho <i class="fas fa-sort sort-icon"></i></th>
                                <th onclick="ordenar(3)" width="25%">Repartidor <i class="fas fa-sort sort-icon"></i></th>
                                <th onclick="ordenar(4)" width="10%" class="text-center">Items <i class="fas fa-sort sort-icon"></i></th>
                                <th width="20%" class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="fileTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    
    // --- CONFIGURACIÓN GLOBAL ---
    let baseDeDatos = []; 
    let resumenDatos = [];
    let ordenActual = { col: -1, asc: true };
    const BRAND_COLOR = "#C50D23"; // Rojo Genovesa

    // --- LOGO SVG (REUTILIZABLE) ---
    const SVG_GENOVESA = `
    <svg viewBox="0 0 284 164" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
      <path d="m142 7 135 47v56l-135 47-135-47V54z" fill="${BRAND_COLOR}" stroke="${BRAND_COLOR}" stroke-width="10" stroke-linejoin="round"></path>
      <path d="m142 7 135 47v56l-135 47-135-47V54z" fill="none" stroke="#B08D57" stroke-width="2" stroke-linejoin="round"></path>
      <text x="142" y="68" font-family="Times, serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#404040">LA</text>
      <text x="142" y="67" font-family="Times, serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#FFF">LA</text>
      <text x="142" y="103" font-family="Times, serif" font-size="42" font-weight="bold" text-anchor="middle" fill="#404040">GENOVESA</text>
      <text x="142" y="102" font-family="Times, serif" font-size="42" font-weight="bold" text-anchor="middle" fill="#FFF">GENOVESA</text>
      <text x="142" y="127" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#FFF" letter-spacing="3">DESDE 1977</text>
    </svg>`;

    // Insertar logo en header al cargar
    document.getElementById('headerLogoContainer').innerHTML = `<div style="width: 100px;">${SVG_GENOVESA}</div>`;

    // --- GESTIÓN DE TEMAS (DÍA / NOCHE) ---
    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem('genFilerTheme', isDark ? 'dark' : 'light');
        updateThemeIcon(isDark);
    }

    function updateThemeIcon(isDark) {
        const btn = document.getElementById('themeBtn');
        btn.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        btn.title = isDark ? "Cambiar a Modo Día" : "Cambiar a Modo Noche";
    }

    window.onload = function() {
        const savedTheme = localStorage.getItem('genFilerTheme');
        if(savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
            updateThemeIcon(true);
        }
    };

    // --- LÓGICA DE PROCESAMIENTO ---
    async function procesarArchivos() {
        const input = document.getElementById('pdfInput');
        const log = document.getElementById('log');
        const panel = document.getElementById('resultPanel');
        
        if (!input.files.length) return alert("Por favor seleccione archivos PDF.");
        
        baseDeDatos = [];
        log.innerHTML = "Iniciando motor GenFiler...\n";
        panel.style.display = 'none';
        document.getElementById('searchInput').value = '';

        for (let file of input.files) {
            log.innerHTML += `> Analizando: ${file.name} ... `;
            try {
                const lineas = await extraerGeometrico(file);
                const filas = procesar(lineas, file.name);
                
                if (filas.length > 0) {
                    baseDeDatos.push(...filas);
                    log.innerHTML += `OK (${filas.length} líneas)\n`;
                } else {
                    log.innerHTML += `VACÍO\n`;
                }
            } catch (e) {
                console.error(e);
                log.innerHTML += `ERROR: ${e.message}\n`;
            }
        }

        if (baseDeDatos.length > 0) {
            prepararResumen();
            actualizarKPIs();
            renderizarTabla();
            panel.style.display = 'block';
            document.getElementById('statusBadge').className = 'badge bg-success px-3 py-2';
            document.getElementById('statusBadge').innerText = "Procesamiento Exitoso";
            log.innerHTML += `\n✅ COMPLETADO.`;
        } else {
            document.getElementById('statusBadge').className = 'badge bg-danger px-3 py-2';
            document.getElementById('statusBadge').innerText = "Falló el Procesamiento";
            log.innerHTML += `\n⚠️ No se encontraron datos válidos.`;
        }
    }

    // --- GESTIÓN DE DATOS & UI ---
    function actualizarKPIs() {
        document.getElementById('kpiFiles').innerText = resumenDatos.length;
        document.getElementById('kpiDespachos').innerText = new Set(baseDeDatos.map(d => d["Numero Despacho"])).size;
        document.getElementById('kpiItems').innerText = baseDeDatos.length;
    }

    function prepararResumen() {
        const mapa = {};
        baseDeDatos.forEach(row => {
            const f = row.Origen;
            if (!mapa[f]) {
                mapa[f] = { 
                    archivo: f, 
                    despacho: parseInt(row["Numero Despacho"]) || 0,
                    repartidor: row["Nombre Repartidor"] || "Desconocido",
                    items: 0 
                };
            }
            mapa[f].items++;
        });
        resumenDatos = Object.values(mapa);
    }

    function renderizarTabla() {
        const tbody = document.getElementById('fileTableBody');
        tbody.innerHTML = "";
        const term = document.getElementById('searchInput').value.toLowerCase();

        resumenDatos.forEach(info => {
            const searchStr = `${info.archivo} ${info.despacho} ${info.repartidor}`.toLowerCase();
            if (!searchStr.includes(term)) return;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="text-center"><i class="fas fa-check-circle text-success"></i></td>
                <td><span class="txt-file">${info.archivo}</span></td>
                <td class="text-center"><span class="txt-despacho">N° ${info.despacho}</span></td>
                <td><span class="txt-repartidor"><i class="fas fa-user-tag me-1"></i>${info.repartidor}</span></td>
                <td class="text-center"><span class="badge-count">${info.items}</span></td>
                <td class="text-center">
                    <button class="btn btn-print" onclick="imprimirZebra('${info.archivo}')">
                        <i class="fas fa-print me-1"></i> Etiquetas
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function filtrarTabla() { renderizarTabla(); }

    function ordenar(colIndex) {
        if (ordenActual.col === colIndex) ordenActual.asc = !ordenActual.asc;
        else { ordenActual.col = colIndex; ordenActual.asc = true; }

        // Actualizar iconos
        document.querySelectorAll('.table-custom th').forEach((th, idx) => {
            th.classList.remove('th-active');
            let icon = th.querySelector('.sort-icon');
            if(icon) icon.className = 'fas fa-sort sort-icon';
            if (idx === colIndex) {
                th.classList.add('th-active');
                icon.className = ordenActual.asc ? 'fas fa-sort-up sort-icon' : 'fas fa-sort-down sort-icon';
            }
        });

        resumenDatos.sort((a, b) => {
            let valA, valB;
            switch(colIndex) {
                case 1: valA = a.archivo; valB = b.archivo; break;
                case 2: valA = a.despacho; valB = b.despacho; break;
                case 3: valA = a.repartidor; valB = b.repartidor; break;
                case 4: valA = a.items; valB = b.items; break;
                default: return 0;
            }
            if (typeof valA === 'string') { valA = valA.toLowerCase(); valB = valB.toLowerCase(); }
            if (valA < valB) return ordenActual.asc ? -1 : 1;
            if (valA > valB) return ordenActual.asc ? 1 : -1;
            return 0;
        });
        renderizarTabla();
    }

    // --- MOTOR DE EXTRACCIÓN (GAP LOGIC v3) ---
    async function extraerGeometrico(file) {
        const buf = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument(buf).promise;
        let lineas = [];
        for (let p = 1; p <= pdf.numPages; p++) {
            const page = await pdf.getPage(p);
            const content = await page.getTextContent();
            let items = content.items;
            items.sort((a,b)=>{
                let dy = Math.abs(a.transform[5]-b.transform[5]);
                return dy>2 ? b.transform[5]-a.transform[5] : a.transform[4]-b.transform[4];
            });
            let cY=-9999, cL="", lX=0, inicio=true;
            for(let it of items){
                let dy = Math.abs(it.transform[5]-cY);
                if(dy>2){
                    if(cL.trim()) lineas.push(cL.trim());
                    cL=it.str; cY=it.transform[5]; lX=it.transform[4]+it.width; inicio=false;
                } else {
                    let gap = it.transform[4]-lX;
                    cL += (gap > 9 && !inicio ? " | " : " ") + it.str;
                    lX = it.transform[4]+it.width;
                }
            }
            if(cL.trim()) lineas.push(cL.trim());
        }
        return lineas;
    }

    function procesar(lineas, nombreArchivo) {
        let f=[]; 
        let ctx={desp:"",rCod:"",rNom:"",cCod:"",cNom:"",cDir:"",dTip:"",dNum:"",dMon:""};
        let lastSig = "";
        for(let l of lineas){
            let raw = l.replace(/"/g,"").trim(); if(!raw) continue;
            let mD = raw.match(/N[°º]\s*(\d+).*Rep:\s*(\d+)\s*\|?\s*(.+)/i);
            if(mD){ ctx.desp=mD[1]; ctx.rCod=mD[2]; ctx.rNom=mD[3].replace(/\|/g,"").trim(); continue; }
            let mC = raw.match(/\b(\d{7})\b/);
            if(mC){
                ctx.cCod = mC[1];
                let txt = raw.replace(ctx.cCod,"").trim();
                let pts = txt.split("|").map(x=>x.trim()).filter(x=>x);
                if(pts.length >= 2) { ctx.cNom=pts[0]; ctx.cDir=pts.slice(1).join(" "); }
                else {
                    ctx.cNom=pts[0]||"";
                    let nx=lineas[lineas.indexOf(l)+1];
                    if(nx){ let nc=nx.replace(/"/g,"").trim(); if(!/Boleta|Factura|Nota P|^\d{8}/i.test(nc)) ctx.cDir=nc.replace(/\|/g," ").trim(); else ctx.cDir=""; }
                }
                ctx.dTip=""; ctx.dNum=""; ctx.dMon=""; lastSig=""; continue;
            }
            if(/Boleta|Factura|Nota P/i.test(raw)){
                let mT=raw.match(/(Boleta|Factura|Nota P)/i); if(mT)ctx.dTip=mT[1];
                let mN=raw.match(/(\d{3}\s*-\s*\d+)/); if(mN)ctx.dNum=mN[1].replace(/\s/g,"");
                let mM=raw.match(/S\/\s*\|?\s*([\d,\.]+\d)/); 
                if(mM)ctx.dMon=mM[1].replace(/,/g,"");
                else { let t=raw.split(/[\s|]+/); let last=t[t.length-1]; if(/^[\d,\.]+\d$/.test(last))ctx.dMon=last.replace(/,/g,""); }
            }
            if(raw.replace(/\|/g,"").trim()==="S/"){
                let nx=lineas[lineas.indexOf(l)+1];
                if(nx && /^[\d,\.]+\d$/.test(nx.replace(/[|"]/g,"").trim())) ctx.dMon=nx.replace(/[|",]/g,"").trim();
            }
            let mP = raw.match(/^\|?\s*(\d{8})\s*\|?\s*(.+)/);
            if(mP){
                let pCod=mP[1], pRest=mP[2], pNom=pRest, pCant="";
                let mQt=pRest.match(/(\d+\.\d{2})$/);
                if(mQt){ pCant=mQt[1]; pNom=pNom.replace(pCant,"").replace(/\|/g,"").trim(); }
                else {
                    let nx=lineas[lineas.indexOf(l)+1];
                    if(nx){ let nxc=nx.replace(/[|"]/g,"").trim(); if(/^\d+\.\d{2}$/.test(nxc)) pCant=nxc; }
                }
                let cantF = parseFloat(pCant||0);
                let sig = `${pCod}-${pNom}-${cantF}-${ctx.dNum}`;
                if(sig === lastSig) continue; lastSig = sig;
                f.push({
                    "Origen": nombreArchivo, "Numero Despacho":ctx.desp, "Codigo Repartidor":ctx.rCod, "Nombre Repartidor":ctx.rNom,
                    "Codigo Cliente":ctx.cCod, "Nombre Cliente":ctx.cNom, "Direccion":ctx.cDir,
                    "Tipo Documento":ctx.dTip, "Numero Documento":ctx.dNum, "Monto Total":parseFloat(ctx.dMon||0),
                    "Codigo Producto":pCod, "Nombre Producto":pNom, "Cantidad":cantF
                });
            }
        }
        return f;
    }

    // --- IMPRESORA ZEBRA (V23 Layout - Final) ---
    function imprimirZebra(filtroArchivo) {
        let datos = filtroArchivo ? baseDeDatos.filter(row => row.Origen === filtroArchivo) : baseDeDatos;
        if (datos.length === 0) return alert("No hay datos para imprimir.");
        
        let repName = datos[0]["Nombre Repartidor"] || "Múltiples";
        
        let grupos = {};
        datos.forEach(fila => {
            let k = `${fila["Numero Despacho"]}-${fila["Tipo Documento"]}-${fila["Numero Documento"]}`;
            if (!grupos[k]) grupos[k] = { cab: fila, prods: [] };
            grupos[k].prods.push(fila);
        });

        const timeStamp = new Date().toLocaleDateString() + " " + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        const ITEMS_PAG = 5;

        let html = `<html><head><title>Zebra Print</title>
        <style>
            @page { size: 100mm 50mm; margin: 0; }
            body { margin: 0; padding: 0; font-family: 'Arial Narrow', sans-serif; font-size: 11px; color: #000; background: #fff; }
            .etiqueta { width: 100mm; height: 49mm; padding: 1mm 2mm; page-break-after: always; break-after: page; position: relative; box-sizing: border-box; display: flex; flex-direction: column; }
            .row-client { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid #000; padding-bottom: 1px; }
            .client-name { font-weight: 900; font-size: 13px; text-transform: uppercase; width: 75%; white-space: nowrap; overflow: hidden; }
            .monto-box { font-weight: 900; font-size: 14px; text-align: right; width: 25%; }
            .row-addr { font-size: 10px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-transform: uppercase; }
            .row-meta { font-size: 9px; margin-top: 1px; border-bottom: 2px solid #000; padding-bottom: 2px; margin-bottom: 1px; display: flex; justify-content: space-between; background: #eee; padding: 1px 2px; }
            .meta-item { font-weight: bold; }
            .prod-table-container { flex-grow: 1; }
            table { width: 100%; font-size: 10px; border-collapse: collapse; }
            td { border-bottom: 1px dotted #999; padding: 1px 0; vertical-align: top; }
            tr:last-child td { border-bottom: none; }
            .col-cant { width: 12%; text-align: left; font-weight: 900; font-size: 11px; } 
            .col-prod { width: 88%; text-align: left; white-space: nowrap; overflow: hidden; }
            .footer { border-top: 1px solid #000; padding-top: 1px; margin-top: auto; display: flex; justify-content: space-between; align-items: center; font-size: 8px; }
            .logo { height: 22px; width: auto; }
            @media print { .no-print { display: none; } }
        </style></head><body>
        <div class="no-print" style="padding:20px;text-align:center;background:#2c3e50;color:white;">
            <h3>Vista Previa: <span style="color:#f1c40f">👤 ${repName}</span></h3>
            <button onclick="window.print()" style="font-size:16px;font-weight:bold;padding:12px 25px;cursor:pointer;background:#f1c40f;border:none;border-radius:4px;color:#000;">🖨️ IMPRIMIR AHORA</button>
        </div>`;

        for(let k in grupos){
            let g = grupos[k]; let c = g.cab; let chunks = [];
            for(let i=0; i<g.prods.length; i+=ITEMS_PAG) chunks.push(g.prods.slice(i, i+ITEMS_PAG));
            chunks.forEach((chunk, i)=>{
                html += `<div class="etiqueta">
                    <div class="row-client">
                        <div class="client-name">${c["Nombre Cliente"]}</div>
                        <div class="monto-box">S/ ${c["Monto Total"].toFixed(2)}</div>
                    </div>
                    <div class="row-addr">${c["Direccion"].substring(0,60)}</div>
                    <div class="row-meta">
                        <span class="meta-item">DSP: ${c["Numero Despacho"]}</span>
                        <span class="meta-item">| REP: ${c["Codigo Repartidor"]}</span>
                        <span class="meta-item">| CLI: ${c["Codigo Cliente"]}</span>
                        <span class="meta-item">| ${c["Tipo Documento"]} ${c["Numero Documento"]}</span>
                    </div>
                    <div class="prod-table-container">
                        <table><tbody>`;
                chunk.forEach(p=>{ html += `<tr><td class="col-cant">${p["Cantidad"]}</td><td class="col-prod">${p["Nombre Producto"]}</td></tr>`; });
                html += `</tbody></table>
                    </div>
                    <div class="footer">
                        <div style="width:40px">${SVG_GENOVESA}</div>
                        <div>${timeStamp}</div>
                        <div style="font-weight:900">Pág ${i+1}/${chunks.length}</div>
                    </div>
                </div>`;
            });
        }
        html += `</body></html>`;
        let w=window.open('','_blank'); w.document.write(html); w.document.close();
    }

    function descargarExcelGlobal() {
        if(baseDeDatos.length === 0) return alert("No hay datos.");
        const ws=XLSX.utils.json_to_sheet(baseDeDatos);
        const wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,ws,"GenFiler_Data");
        XLSX.writeFile(wb,"GenFiler_Export.xlsx");
    }
</script>
</body>
</html>
