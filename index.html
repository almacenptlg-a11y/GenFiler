<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GenFiler v6.1: Final Release</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#C50D23">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- ESTILOS GENERALES --- */
        :root { --bg-body: #f0f2f5; --bg-card: #ffffff; --header-bg: #2c3e50; --header-text: #ffffff; --text-main: #2c3e50; --text-sec: #7f8c8d; --border-color: #ecf0f1; --input-bg: #ffffff; --input-border: #ced4da; --table-head-bg: #f8f9fa; --table-hover: #f1f2f6; --highlight: #2980b9; --brand-color: #C50D23; --kpi-bg: #ffffff; --modal-bg: #ffffff; }
        body.dark-mode { --bg-body: #121212; --bg-card: #1e1e1e; --header-bg: #000000; --header-text: #e0e0e0; --text-main: #e0e0e0; --text-sec: #a0a0a0; --border-color: #333333; --input-bg: #2c2c2c; --input-border: #444444; --table-head-bg: #252525; --table-hover: #2a2a2a; --highlight: #48dbfb; --brand-color: #ff4757; --kpi-bg: #252525; --modal-bg: #1e1e1e; }
        
        body { background: var(--bg-body); padding: 25px; font-family: 'Segoe UI', system-ui, sans-serif; transition: all 0.3s ease; color: var(--text-main); }
        .main-card { background: var(--bg-card); border-radius: 16px; padding: 0; max-width: 1200px; margin: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.15); overflow: hidden; }
        .header-panel { background: var(--header-bg); color: var(--header-text); padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--brand-color); }
        .body-panel { padding: 30px; }
        .kpi-container { display: flex; gap: 20px; margin-bottom: 25px; flex-wrap: wrap; }
        .kpi-card { flex: 1; min-width: 200px; background: var(--kpi-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border-left: 5px solid var(--highlight); }
        .kpi-value { font-size: 1.8rem; font-weight: 800; color: var(--text-main); }
        .kpi-label { font-size: 0.8rem; color: var(--text-sec); text-transform: uppercase; }
        .log-box { background: #111; color: #00ff9d; padding: 15px; height: 100px; overflow-y: auto; font-family: 'Consolas', monospace; font-size: 11px; border-radius: 8px; margin-bottom: 20px; }
        .table-custom { width: 100%; border-collapse: separate; border-spacing: 0; }
        .table-custom th { background: var(--table-head-bg); color: var(--text-sec); font-weight: 700; text-transform: uppercase; font-size: 0.75rem; padding: 15px; text-align: left; border-bottom: 2px solid var(--border-color); cursor: pointer; white-space: nowrap; }
        .table-custom td { padding: 12px 15px; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; vertical-align: middle; }
        .table-custom tr:hover { background-color: var(--table-hover); }
        .txt-despacho { font-family: monospace; font-weight: bold; font-size: 1.1em; color: var(--brand-color); }
        .txt-repartidor { font-weight: 600; color: var(--highlight); }
        .badge-count { background: var(--border-color); color: var(--text-main); padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 0.8rem; }
        .badge-gps-ok { background: #27ae60; color: white; border-radius: 4px; padding: 3px 8px; font-size: 0.75rem; font-weight: bold; }
        .badge-gps-err { background: #c0392b; color: white; border-radius: 4px; padding: 3px 8px; font-size: 0.75rem; font-weight: bold; }
        .search-box input { background: var(--input-bg); border: 1px solid var(--input-border); color: var(--text-main); padding: 12px 15px 12px 45px; border-radius: 50px; width: 100%; }
        .search-box i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-sec); }
        .btn-theme { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); color: white; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .btn-action { border: none; font-size: 0.8rem; padding: 6px 12px; border-radius: 6px; font-weight: 600; margin-right: 5px; }
        .btn-print { background: var(--text-main); color: var(--bg-card); }
        .btn-table { background: var(--border-color); color: var(--text-main); }
        .btn-primary-custom { background-color: var(--highlight); color: white; border: none; }
        .modal-content { background-color: var(--modal-bg); color: var(--text-main); border: 1px solid var(--border-color); }
        .table-report th { background: var(--highlight); color: white; }
        .sort-icon { float: right; opacity: 0.5; margin-top: 2px; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="main-card">
        <div class="header-panel">
            <div class="d-flex align-items-center gap-3">
                <div id="headerLogoContainer" style="width: 50px;"></div> 
                <div class="border-start border-secondary ps-3">
                    <h3 class="fw-bold m-0">GenFiler</h3>
                    <small style="opacity: 0.7; font-size: 0.75rem;">V6.1 FINAL</small>
                </div>
            </div>
            <div class="d-flex align-items-center gap-3">
                <span class="badge bg-secondary px-3 py-2" id="statusBadge">Esperando</span>
                <button class="btn-theme" onclick="toggleTheme()" id="themeBtn"><i class="fas fa-moon"></i></button>
            </div>
        </div>
        
        <div class="body-panel">
            <div class="row g-3 align-items-center mb-4">
                <div class="col-md-9"><div class="input-group input-group-lg shadow-sm"><span class="input-group-text border-end-0"><i class="far fa-file-pdf" style="color: var(--brand-color)"></i></span><input type="file" id="pdfInput" class="form-control border-start-0" multiple accept=".pdf"></div></div>
                <div class="col-md-3"><button class="btn btn-primary-custom w-100 btn-lg fw-bold shadow-sm" onclick="procesarArchivos()"><i class="fas fa-sync-alt me-2"></i> PROCESAR</button></div>
            </div>

            <div id="log" class="log-box">Sistema v6.1 listo.</div>

            <div id="resultPanel" style="display:none;">
                <div class="kpi-container">
                    <div class="kpi-card"><div><div class="kpi-label">Archivos</div><div class="kpi-value" id="kpiFiles">0</div></div></div>
                    <div class="kpi-card"><div><div class="kpi-label">Despachos</div><div class="kpi-value" id="kpiDespachos">0</div></div></div>
                    <div class="kpi-card"><div><div class="kpi-label">Productos</div><div class="kpi-value" id="kpiItems">0</div></div></div>
                </div>

                <div class="row align-items-center mb-3 g-3">
                    <div class="col-md-6"><div class="search-box"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Buscar..." onkeyup="filtrarTabla()"></div></div>
                    <div class="col-md-6 text-end">
                        <button class="btn btn-primary fw-bold shadow-sm me-2" onclick="generarReporteGlobal()">Global Tacna</button>
                        <button class="btn btn-success fw-bold shadow-sm" onclick="descargarExcelGlobal()">Excel Full</button>
                    </div>
                </div>

                <div class="table-responsive" style="max-height: 600px; overflow-y: auto;">
                    <table class="table-custom" id="mainTable">
                        <thead>
                            <tr>
                                <th onclick="ordenar(0)" width="5%"><i class="fas fa-sort"></i></th>
                                <th onclick="ordenar(1)" width="25%">Archivo <i class="fas fa-sort"></i></th>
                                <th onclick="ordenar(2)" width="15%">Despacho <i class="fas fa-sort"></i></th>
                                <th onclick="ordenar(3)" width="25%">Repartidor <i class="fas fa-sort"></i></th>
                                <th onclick="ordenar(4)" width="10%" class="text-center">Items <i class="fas fa-sort"></i></th>
                                <th onclick="ordenar(5)" width="10%" class="text-center">GPS <i class="fas fa-sort"></i></th>
                                <th width="10%" class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="fileTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="reportModal" tabindex="-1"><div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable"><div class="modal-content"><div class="modal-header"><h5 class="modal-title fw-bold" id="reportModalTitle">Reporte</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="table-responsive"><table class="table table-report" id="modalTable"><thead id="modalThead"></thead><tbody id="reportModalBody"></tbody></table></div></div><div class="modal-footer justify-content-between"><div id="modalLogoFooter" style="width:30px"></div><div><button type="button" class="btn btn-outline-dark me-2" onclick="imprimirReporteA4()">A4 Oficial</button><button type="button" class="btn btn-primary fw-bold" id="btnDownloadCSV">.CSV</button></div></div></div></div></div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    
    let baseDeDatos = []; let resumenDatos = []; let ordenActual = { col: -1, asc: true };
    const BRAND_COLOR = "#C50D23"; let currentReportData = []; let currentReportType = "";
    
    const SVG_GENOVESA = `<svg viewBox="0 0 284 164" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><path d="m142 7 135 47v56l-135 47-135-47V54z" fill="${BRAND_COLOR}" stroke="${BRAND_COLOR}" stroke-width="10" stroke-linejoin="round"></path><path d="m142 7 135 47v56l-135 47-135-47V54z" fill="none" stroke="#B08D57" stroke-width="2" stroke-linejoin="round"></path><text x="142" y="68" font-family="Times, serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#404040">LA</text><text x="142" y="67" font-family="Times, serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#FFF">LA</text><text x="142" y="103" font-family="Times, serif" font-size="42" font-weight="bold" text-anchor="middle" fill="#404040">GENOVESA</text><text x="142" y="102" font-family="Times, serif" font-size="42" font-weight="bold" text-anchor="middle" fill="#FFF">GENOVESA</text><text x="142" y="127" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#FFF" letter-spacing="3">DESDE 1977</text></svg>`;
    document.getElementById('headerLogoContainer').innerHTML = SVG_GENOVESA;
    document.getElementById('modalLogoFooter').innerHTML = SVG_GENOVESA;

    window.onload = function() { if(localStorage.getItem('genFilerTheme') === 'dark') { document.body.classList.add('dark-mode'); toggleTheme(true); } };
    function toggleTheme(skipToggle) {
        if(!skipToggle) document.body.classList.toggle('dark-mode');
        localStorage.setItem('genFilerTheme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        document.getElementById('themeBtn').innerHTML = document.body.classList.contains('dark-mode') ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    }

    async function procesarArchivos() {
        const input = document.getElementById('pdfInput'); const log = document.getElementById('log'); const panel = document.getElementById('resultPanel');
        if (!input.files.length) return alert("Seleccione archivos PDF.");
        baseDeDatos = []; log.innerHTML = "Analizando...\n"; 
        for (let file of input.files) {
            log.innerHTML += `> ${file.name} ... `;
            try {
                const lineas = await extraerGeometrico(file);
                const filas = procesarLineasV58(lineas, file.name);
                if (filas.length > 0) { baseDeDatos.push(...filas); log.innerHTML += `OK (${filas.length})\n`; } 
                else { log.innerHTML += `VACÍO\n`; }
            } catch (e) { console.error(e); log.innerHTML += `ERROR\n`; }
        }
        panel.style.display = 'block'; 
        if (baseDeDatos.length > 0) { 
            try { prepararResumen(); actualizarKPIs(); renderizarTabla(); document.getElementById('statusBadge').className = 'badge bg-success'; document.getElementById('statusBadge').innerText = "Listo"; log.innerHTML += `\n✅ COMPLETADO.`; } catch(e) { console.error(e); log.innerHTML += `\n❌ ERROR UI: ${e.message}`; }
        } else { document.getElementById('statusBadge').className = 'badge bg-warning text-dark'; document.getElementById('statusBadge').innerText = "Sin Datos"; }
    }

    async function extraerGeometrico(file) {
        const buf = await file.arrayBuffer(); const pdf = await pdfjsLib.getDocument(buf).promise; let lineas = [];
        for (let p = 1; p <= pdf.numPages; p++) {
            const page = await pdf.getPage(p); const content = await page.getTextContent(); let items = content.items;
            items.sort((a,b)=>{ let dy = Math.abs(a.transform[5]-b.transform[5]); return dy>2 ? b.transform[5]-a.transform[5] : a.transform[4]-b.transform[4]; });
            let cY=-9999, cL="", lX=0, inicio=true;
            for(let it of items){
                let dy = Math.abs(it.transform[5]-cY);
                if(dy>2){ if(cL.trim()) lineas.push(cL.trim()); cL=it.str; cY=it.transform[5]; lX=it.transform[4]+it.width; inicio=false; } 
                else { let gap = it.transform[4]-lX; cL += (gap > 4 && !inicio ? " | " : " ") + it.str; lX = it.transform[4]+it.width; }
            }
            if(cL.trim()) lineas.push(cL.trim());
        }
        return lineas;
    }

    function procesarLineasV58(lineas, nombreArchivo) {
        let resultados = [];
        let ctx = { despacho: "---", rCod: "---", rNom: "", cCod: "---", cliente: "---", cDir:"", lat: "", lon: "", vendedor: "---", docTipo:"", docNum:"", monto:0, fecha: "---" };
        let headerTxt = lineas.join(" ");
        let mHeader = headerTxt.match(/N[°º]\s*(\d+).*Rep:\s*(\d+)\s*\|?\s*([A-Z\s]+)/i);
        if(mHeader) { ctx.despacho = mHeader[1]; ctx.rCod = mHeader[2]; ctx.rNom = mHeader[3].replace(/Cliente/i, "").trim(); }
        let mFecha = headerTxt.match(/Fecha:\s*(\d{2}\/\d{2}\/\d{4})/i); if(mFecha) ctx.fecha = mFecha[1];

        for(let i = 0; i < lineas.length; i++) {
            let raw = lineas[i].replace(/"/g, "").trim(); if(!raw) continue;
            let mD = raw.match(/N[°º]\s*(\d+).*Rep:\s*(\d+)\s*\|?\s*(.+)/i);
            if(mD) { ctx.despacho = mD[1]; ctx.rCod = mD[2]; ctx.rNom = mD[3].replace(/Cliente/i, "").trim(); continue; }
            if(raw.includes("Rep:") || raw.includes("Repartidor")) continue;
            let mVend = raw.match(/Vendedor\s*\|?\s*(\d{5})/i); if(mVend) { ctx.vendedor = mVend[1]; } 
            let mLat = raw.match(/(-1[78]\.\d{4,})/); if(mLat) ctx.lat = mLat[1];
            let mLon = raw.match(/(-7[01]\.\d{4,})/); if(mLon) ctx.lon = mLon[1];
            if(/Boleta|Factura|Nota P/i.test(raw)){
                let mT = raw.match(/(Boleta|Factura|Nota P)/i); if(mT) ctx.docTipo = mT[1];
                let mN = raw.match(/(\d{3}\s*-\s*\d+)/); if(mN) ctx.docNum = mN[1].replace(/\s/g,"");
                let mM = raw.match(/S\/\s*([\d,\.]+)/); if(mM) ctx.monto = parseFloat(mM[1].replace(/,/g,""));
            }
            let mCli = raw.match(/\b(\d{7})\b/);
            if(mCli && !raw.includes("Latitud") && !raw.includes("Longitud") && !mLat && !mLon) {
                 ctx.cCod = mCli[1];
                 let partes = raw.split("|");
                 let idxCodigo = partes.findIndex(p => p.includes(ctx.cCod));
                 if(idxCodigo !== -1) {
                     ctx.cliente = partes[idxCodigo].replace(ctx.cCod, "").trim();
                     if(partes.length > idxCodigo + 1) { ctx.cDir = partes.slice(idxCodigo + 1).join(" ").trim(); } else { ctx.cDir = ""; }
                 }
            }
            let mProd = raw.match(/\b(\d{9})\b\s+(.+)/);
            if(mProd) {
                let pCod = mProd[1]; let resto = mProd[2]; let pNom = resto; let pCant = "0";
                let mCant = resto.match(/(\d+\.\d{2})$/);
                if(mCant) { pCant = mCant[1]; pNom = resto.replace(pCant, "").replace(/\|/g, "").trim(); } 
                else { if(lineas[i+1]) { let nextLine = lineas[i+1].replace(/"/g,"").trim(); if(/^[\d\.]+\d{2}$/.test(nextLine)) pCant = nextLine; } }
                if(!pNom.match(/Latitud|Longitud|Vendedor|Boleta|Factura|Nota P/i)) {
                    resultados.push({
                        "Origen": nombreArchivo, "Numero Despacho": ctx.despacho, "Fecha": ctx.fecha, "Codigo Repartidor": ctx.rCod, "Nombre Repartidor": ctx.rNom,
                        "Codigo Cliente": ctx.cCod, "Nombre Cliente": ctx.cliente, "Direccion": ctx.cDir, "Vendedor": ctx.vendedor,
                        "Lat": ctx.lat, "Lon": ctx.lon, "Tipo Documento": ctx.docTipo, "Numero Documento": ctx.docNum, "Monto Total": ctx.monto,
                        "Codigo Producto": pCod, "Nombre Producto": pNom, "Cantidad": parseFloat(pCant || 0)
                    });
                }
            }
        }
        return resultados;
    }

    function prepararResumen() { 
        const mapa = {}; 
        baseDeDatos.forEach(row => { 
            const key = row.Origen; 
            if (!mapa[key]) { mapa[key] = { archivo: row.Origen, despacho: row["Numero Despacho"], rNom: row["Nombre Repartidor"] || "Desconocido", items: 0, missingGPS: false }; } 
            mapa[key].items++; if(!row.Lat || !row.Lon) mapa[key].missingGPS = true;
        }); 
        resumenDatos = Object.values(mapa); 
    }
    
    function renderizarTabla() { 
        const tbody = document.getElementById('fileTableBody'); tbody.innerHTML = ""; const term = document.getElementById('searchInput').value.toLowerCase(); 
        resumenDatos.forEach(info => { 
            if (!JSON.stringify(info).toLowerCase().includes(term)) return; 
            const tr = document.createElement('tr'); 
            let badge = info.missingGPS ? '<span class="badge-gps-err"><i class="fas fa-exclamation-triangle"></i> FALTAN</span>' : '<span class="badge-gps-ok"><i class="fas fa-check"></i> OK</span>';
            let nombreMostrar = info.rNom; try { nombreMostrar = `${info.rNom.split(' ')[0]} ${info.rNom.split(' ')[1]||''}`; } catch(e) {}
            tr.innerHTML = `
                <td class="text-center"><i class="fas fa-file-pdf text-danger"></i></td>
                <td><span class="fw-bold">${info.archivo}</span></td>
                <td><span class="txt-despacho">${info.despacho}</span></td>
                <td><span class="txt-repartidor">${nombreMostrar}</span></td>
                <td class="text-center"><span class="badge-count">${info.items}</span></td>
                <td class="text-center">${badge}</td>
                <td class="text-center">
                    <button class="btn btn-action btn-table" title="Ver Detalle" onclick="generarReporteDespacho('${info.archivo}')"><i class="fas fa-list"></i></button>
                    <button class="btn btn-action btn-print" title="Imprimir Etiquetas" onclick="abrirEstudioImpresion('${info.archivo}')"><i class="fas fa-print"></i></button>
                </td>`; 
            tbody.appendChild(tr); 
        }); 
    }

    // --- PRINT STUDIO INTERACTIVO ---

    function abrirEstudioImpresion(filtroArchivo) {
        let datos = baseDeDatos.filter(row => row.Origen === filtroArchivo);
        if (datos.length === 0) return alert("Sin datos.");
        
        let repName = datos[0]["Nombre Repartidor"];
        let fecha = datos[0]["Fecha"] || "";

        let grupos = {}; 
        datos.forEach(fila => { 
            let k = `${fila["Numero Despacho"]}-${fila["Tipo Documento"]}-${fila["Numero Documento"]}`; 
            if (!grupos[k]) grupos[k] = { cab: fila, prods: [] }; 
            grupos[k].prods.push(fila); 
        });
        
        let etiquetasHTML = "";
        const ITEMS_PAG = 6;
        
        for(let k in grupos){ 
            let g = grupos[k]; let c = g.cab; let chunks = []; 
            let qrHtml = ""; 
            if(c.Lat && c.Lon) { 
                let mapUrl = `https://www.google.com/maps/search/?api=1&query=${c.Lat},${c.Lon}`; 
                let qr = new QRious({ value: mapUrl, size: 150 }); 
                qrHtml = `<img src="${qr.toDataURL()}" class="qr-img">`; 
            } 
            for(let i=0; i<g.prods.length; i+=ITEMS_PAG) chunks.push(g.prods.slice(i, i+ITEMS_PAG)); 
            
            chunks.forEach((chunk, i)=>{ 
                etiquetasHTML += `
                <div class="etiqueta-wrapper" data-search="${c["Nombre Cliente"].toLowerCase()} ${c["Tipo Documento"].toLowerCase()} ${c["Numero Documento"].toLowerCase()}">
                    <div class="etiqueta">
                        <div class="row-client">
                            <div class="client-name">${c["Nombre Cliente"]}</div>
                            <div class="monto-box">S/ ${c["Monto Total"].toFixed(2)}</div>
                        </div>
                        <div class="row-addr">${c["Direccion"].substring(0,90)}</div>
                        <div class="row-meta">
                            <span class="meta-item">DSP: ${c["Numero Despacho"]}</span>
                            <span class="meta-item">| REP: ${c["Codigo Repartidor"]}</span>
                            <span class="meta-item">| VEND: ${c["Vendedor"]}</span>
                            <span class="meta-item">| CLI: ${c["Codigo Cliente"]}</span>
                            <span class="meta-item">| ${c["Tipo Documento"]} ${c["Numero Documento"]}</span>
                        </div>
                        <div class="content-wrapper">
                            <div class="prod-table-container">
                                <table><tbody>
                                    ${chunk.map(p=>`<tr><td class="col-cant">${p["Cantidad"]}</td><td class="col-prod">${p["Nombre Producto"]}</td></tr>`).join('')}
                                </tbody></table>
                            </div>
                            <div class="qr-container-side">${qrHtml}</div>
                        </div>
                        <div class="footer">
                            <div style="width:40px">${SVG_GENOVESA}</div>
                            <div>${fecha} ${new Date().toLocaleTimeString()}</div>
                            <div style="font-weight:900">Pág ${i+1}/${chunks.length}</div>
                        </div>
                    </div>
                </div>`; 
            }); 
        }

        let w = window.open('','_blank');
        w.document.write(`
        <html><head><title>Print Studio - ${repName}</title>
        <style>
            @page { size: 100mm 50mm; margin: 0; }

    // --- NUEVO: FUNCION DE DESCARGA CSV ---
    function descargarCSV(data, tipo) {
        if (!data || data.length === 0) return alert("No hay datos para descargar.");
        
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; // UTF-8 BOM
        let headers = "";
        let filename = "";

        if (tipo === "GLOBAL") {
            headers = "FECHA DE ENTREGA,LOCALIDAD,ORDEN DE COMPRA,SCAN_COD,PRODUCTO X,PEDIDO\n";
            filename = "Consolidado_Reparto_Tacna_${data[0].col1}.csv";
        } else {
            headers = "FECHA DE ENTREGA,LOCALIDAD,ORDEN DE COMPRA,SCAN_COD,PRODUCTO X,PEDIDO\n";
            filename = `Reporte_Individual_${data[0].col3}.csv`;
        }

        csvContent += headers;

        data.forEach(row => {
             // LÓGICA DE CONVERSIÓN DE FECHA
            let fechaFinal = row.col1;
            if (row.col1 && row.col1.includes('/')) {
                let partes = row.col1.split('/'); // [0]=Dia, [1]=Mes, [2]=Año
                if(partes.length === 3) {
                    fechaFinal = `${partes[1]}/${partes[0]}/${partes[2]}`;
                }
            }
            
            let rowStr = [
                  fechaFinal,       // Fecha en formato EEUU 
                row.col2, 
                row.col3, 
                row.col4, 
                `"${row.col5}"`, // Entrecomillar el nombre del producto por si tiene comas
                row.col6.toFixed(2)
            ].join(",");
            csvContent += rowStr + "\n";
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", filename);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function actualizarKPIs() { document.getElementById('kpiFiles').innerText = resumenDatos.length; document.getElementById('kpiDespachos').innerText = new Set(baseDeDatos.map(d => d["Numero Despacho"])).size; document.getElementById('kpiItems').innerText = baseDeDatos.length; }
    function generarReporteGlobal() {
        currentReportType = "GLOBAL"; document.getElementById('reportModalTitle').innerText = "Reporte Global Consolidado";
        let allDesp = baseDeDatos.map(r => r["Numero Despacho"]).sort();
        let primerDesp = (allDesp[0] || "000000").slice(-6); let ultimoDesp = (allDesp[allDesp.length-1] || "000000").slice(-6); let despachoStr = `${primerDesp}/${ultimoDesp}`;
        let agrupar = {}; baseDeDatos.forEach(row => { let key = row["Nombre Producto"].trim(); if(!agrupar[key]) { agrupar[key] = { col1: row.Fecha, col2: "Reparto Tacna", col3: despachoStr, col4: row["Codigo Producto"], col5: row["Nombre Producto"], col6: 0 }; } agrupar[key].col6 += row["Cantidad"]; });
        currentReportData = Object.values(agrupar); renderizarModalEstructurado();
    }
    function generarReporteDespacho(archivo) {
        currentReportType = "INDIVIDUAL"; let datos = baseDeDatos.filter(r => r.Origen === archivo); if(datos.length === 0) return;

    function renderizarModalEstructurado() {

        document.getElementById('btnDownloadCSV').onclick = () => descargarCSV(currentReportData, currentReportType); new bootstrap.Modal(document.getElementById('reportModal')).show();

    function imprimirReporteA4() { if(!currentReportData || currentReportData.length === 0) return; const title = document.getElementById('reportModalTitle').innerText; const totalItems = currentReportData.reduce((acc, curr) => acc + curr.col6, 0).toFixed(2); let headerRow = ""; if (currentReportType === "GLOBAL") headerRow = `<tr><th>Fecha</th><th>Localidad</th><th>Despacho</th><th>Código</th><th>Producto</th><th class="text-end">Cantidad</th></tr>`; else headerRow = `<tr><th>Fecha</th><th>Loc (Rep)</th><th>Despacho</th><th>Código</th><th>Producto</th><th class="text-end">Pedido</th></tr>`; let html = `<html><head><title>${title}</title><style>@page { size: A4; margin: 15mm; } body { font-family: Arial, sans-serif; color: #000; } .header { display: flex; align-items: center; border-bottom: 2px solid #C50D23; padding-bottom: 10px; margin-bottom: 20px; } .logo { width: 50px; margin-right: 20px; } .info { flex-grow: 1; } h1 { margin: 0; font-size: 18px; color: #C50D23; text-transform: uppercase; } .meta { font-size: 12px; color: #555; } table { width: 100%; border-collapse: collapse; font-size: 11px; } th { background: #eee; text-align: left; padding: 8px; border-bottom: 1px solid #999; font-weight: bold; } td { padding: 8px; border-bottom: 1px solid #ddd; } .total-row { background: #f0f0f0; font-weight: bold; font-size: 12px; } .text-end { text-align: right; }</style></head><body><div class="header"><div class="logo">${SVG_GENOVESA}</div><div class="info"><h1>${title}</h1><div class="meta">Generado: ${new Date().toLocaleString()}</div></div></div><table><thead>${headerRow}</thead><tbody>` + currentReportData.map(r => `<tr><td>${r.col1}</td><td>${r.col2}</td><td>${r.col3}</td><td>${r.col4}</td><td>${r.col5}</td><td class="text-end">${r.col6.toFixed(2)}</td></tr>`).join('') + `<tr class="total-row"><td colspan="5" class="text-end">TOTAL GENERAL:</td><td class="text-end">${totalItems}</td></tr></tbody></table></body></html>`; let w=window.open('','_blank'); w.document.write(html); w.document.close(); setTimeout(() => w.print(), 500); }
    function descargarExcelGlobal() { if(baseDeDatos.length === 0) return alert("No hay datos."); const ws=XLSX.utils.json_to_sheet(baseDeDatos); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Master"); XLSX.writeFile(wb,"GenFiler_Master_v5.xlsx"); }

    function ordenar(colIndex) { if (ordenActual.col === colIndex) ordenActual.asc = !ordenActual.asc; else { ordenActual.col = colIndex; ordenActual.asc = true; } document.querySelectorAll('.table-custom th').forEach((th, idx) => { th.classList.remove('th-active'); let icon = th.querySelector('.sort-icon'); if(icon) icon.className = 'fas fa-sort sort-icon'; if (idx === colIndex) { th.classList.add('th-active'); icon.className = ordenActual.asc ? 'fas fa-sort-up sort-icon' : 'fas fa-sort-down sort-icon'; } }); resumenDatos.sort((a, b) => { let valA, valB; switch(colIndex) { case 1: valA=a.archivo; valB=b.archivo; break; case 2: valA=a.despacho; valB=b.despacho; break; case 3: valA=a.rNom; valB=b.rNom; break; case 4: valA=a.items; valB=b.items; break; default: return 0; } if (typeof valA === 'string') { valA=valA.toLowerCase(); valB=valB.toLowerCase(); } if (valA < valB) return ordenActual.asc ? -1 : 1; if (valA > valB) return ordenActual.asc ? 1 : -1; return 0; }); renderizarTabla(); }
